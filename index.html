<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PT URIP SUGIARTO</title>
<style>
body{margin:0;background:#080808;color:#ffd700;font-family:sans-serif;padding:12px}
.header{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#1a1a1a,#000);border:2px solid #c9a84c;border-radius:12px;padding:10px}
.pt{background:#b91c1c;border:2px solid gold;border-radius:10px;padding:8px 12px;color:white;font-weight:900;flex:1;text-align:center}
.box{background:#111;border:2px solid #c9a84c;border-radius:12px;padding:14px;margin-top:12px}
.scan-title{font-weight:900;font-size:20px;color:#ffdf8a;letter-spacing:1px;margin:0}
.scan-sub{font-size:12px;color:#c9a84c;margin-top:4px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
  background:linear-gradient(145deg,#1c1c1c,#0e0e0e);
  border:2px solid #c9a84c;border-radius:16px;
  aspect-ratio:1/1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:10px;box-shadow:0 0 12px rgba(201,168,76,.18)
}
.card:active{transform:scale(0.95)}
.card .icon{font-size:50px;margin-bottom:6px;filter:drop-shadow(0 0 5px gold)}
.card .lbl{font-weight:900;font-size:14px;color:#ffdf8a}
.card .sub{font-size:10px;color:#aaa;margin-top:4px;line-height:1.2}
.card-gl{background:linear-gradient(180deg,#ffd700,#c9a84c);border-color:white}
.card-gl .lbl,.card-gl .sub{color:black}
.card-gl .icon{filter:none}
.full{grid-column:span 2;aspect-ratio:2/0.85;flex-direction:row;gap:14px}
.full .icon{margin-bottom:0}
.btn-r{width:100%;padding:16px;border-radius:12px;background:#222;color:white;border:2px solid #c9a84c;font-weight:900;margin-top:16px}
</style></head><body>

<div class="header">
  <div style="width:50px;height:50px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center"><img src="logo.png" style="width:100%;height:100%;border-radius:50%"></div>
  <div class="pt">PT. URIPSUGIARTO<br><span style="font-size:10px">SCAN SYSTEM</span></div>
</div>

<div class="box">
  <div class="scan-title">SCAN MENU</div>
  <div class="scan-sub">Pilih metode pemindaian yang tersedia</div>

  <div class="grid">
    <div class="card card-gl" onclick="go('GL')">
      <div class="icon">🌿</div>
      <div class="lbl">SCAN GL</div>
      <div class="sub">QR BAK + ID PC<br>+ ID GL 1 + ID GL 2</div>
    </div>
    <div class="card" onclick="go('KMS')">
      <div class="icon">🖍️</div>
      <div class="lbl">SCAN KMS</div>
      <div class="sub">QR BAK + ID KMS</div>
    </div>
    <div class="card" onclick="go('PACK')">
      <div class="icon">🔐</div>
      <div class="lbl">SCAN PACK</div>
      <div class="sub">QR BAK + ID PACK</div>
    </div>
    <div class="card" onclick="go('BDL')">
      <div class="icon">💶</div>
      <div class="lbl">SCAN BDL</div>
      <div class="sub">QR BAK + ID BDL</div>
    </div>
    <div class="card full" onclick="go('BALL')">
      <div class="icon">📦</div>
      <div><div class="lbl">SCAN BALL</div><div class="sub">QR BAK + ID BALL + NO BOX</div></div>
    </div>
  </div>

  <button class="btn-r" onclick="location.href='riwayat.html'">📋 LIHAT RIWAYAT</button>
  <button class="btn-r" onclick="keluarApp()" style="background:#b91c1c;border-color:gold;color:white;margin-top:10px">❌ KELUAR APLIKASI</button>
</div>

<script>function go(t){localStorage.setItem('scan_type',t);location.href='scan.html';}
function keluarApp(){
  if(confirm("Yakin mau keluar aplikasi min?")){
    try{ window.location.href = "webintoapp://close"; }catch(e){}
    try{ if(window.Android) Android.closeApp(); }catch(e){}
    try{ if(navigator.app) navigator.app.exitApp(); }catch(e){}
  
    setTimeout(()=>{
      document.body.innerHTML = `
        <div style="background:#080808;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:gold;font-family:sans-serif;text-align:center;padding:20px">
          <div style="font-size:60px">👋</div>
          <h2>Terima Kasih Min</h2>
          <p style="color:#aaa">Aplikasi sudah selesai.<br>Silakan tekan tombol BACK HP 2x untuk keluar.</p>
          <button onclick="window.location.href='about:blank'" style="margin-top:20px;padding:16px 30px;background:#b91c1c;color:white;border:2px solid gold;border-radius:12px;font-weight:900">TUTUP LAYAR</button>
        </div>`;
    }, 600);
  }
}
</script>
</body></html>

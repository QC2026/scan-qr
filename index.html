<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PT URIP SUGIARTO</title>
<style>
body {
    margin: 0;
    background: #0f110c; /* Warna background gelap */
    color: #e5cc80;
    font-family: sans-serif;
    padding: 16px;
    box-sizing: border-box;
}
.header {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #141414;
    border: 2px solid #a68942;
    border-radius: 12px;
    padding: 10px;
}
.pt {
    background: #a82416; /* Merah gelap khas PT Uripsugiarto */
    border: 2px solid #a68942;
    border-radius: 8px;
    padding: 8px 12px;
    color: white;
    font-weight: 900;
    flex: 1;
    text-align: center;
    font-size: 16px;
}
.sub-title {
    text-align: center;
    margin: 20px 0 5px 0;
}
.sub-title h2 {
    margin: 0;
    color: #f7e3af;
    font-size: 22px;
    letter-spacing: 1px;
}
.sub-title p {
    margin: 5px 0 0 0;
    font-size: 11px;
    color: #8c856e;
    font-weight: bold;
}

/* --- BAGIAN GRID UTAMA (2 KOLOM) --- */
.grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* Membagi 2 kolom sama rata */
    gap: 14px; /* Jarak antar tombol kotak */
    margin-top: 20px;
}

/* Style Tombol Kotak Menu */
.menu-btn {
    background: #151612;
    border: 2px solid #5a543f; /* Garis tepi tipis kecokelatan */
    border-radius: 14px;
    padding: 20px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
}
.menu-btn:active {
    background: #252620; /* Efek saat ditekan */
    border-color: #a68942;
}
.menu-btn img {
    width: 32px;
    height: 32px;
    margin-bottom: 8px;
    object-fit: contain;
}
.menu-btn span {
    color: #f7e3af;
    font-weight: bold;
    font-size: 16px;
    letter-spacing: 0.5px;
}

/* Status Bar Bawah */
.status-bar {
    margin-top: 30px;
    background: #12170f;
    border: 1px solid #334029;
    border-radius: 20px;
    padding: 8px;
    text-align: center;
    color: white;
    font-size: 14px;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="header"><div style="width:50px;height:50px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center"><img src="logo.png" style="width:100%;height:100%;border-radius:50%"></div><div class="pt">PT. URIPSUGIARTO<br><span style="font-size:10px">SCAN SYSTEM</span></div></div>

<div class="box">
<h3 style="margin:0;text-align:center;color:#ffdf8a">PILIH JENIS SCAN</h3>

<!-- URUTAN GL DULU SESUAI PERMINTAAN MIMIN -->
<button onclick="mulaiScan('GL')" class="btn btn-gl">1️⃣ SCAN GL<br><span style="font-size:12px">QR BAK + ID PC + ID GL 1 + ID GL 2</span></button>

<button onclick="mulaiScan('KMS')" class="btn btn-other">2️⃣ SCAN KMS<br><span style="font-size:12px">QR BAK + ID KMS</span></button>

<button onclick="mulaiScan('PACK')" class="btn btn-other">3️⃣ SCAN PACK<br><span style="font-size:12px">QR BAK + ID PACK</span></button>

<button onclick="mulaiScan('BDL')" class="btn btn-other">4️⃣ SCAN BDL<br><span style="font-size:12px">QR BAK + ID BDL</span></button>

<button onclick="mulaiScan('BALL')" class="btn btn-other">5️⃣ SCAN BALL<br><span style="font-size:12px">QR BAK + ID BALL + NO BOX</span></button>

<button onclick="location.href='riwayat.html'" class="btn" style="background:#222;color:white;margin-top:20px">📋 LIHAT RIWAYAT</button>
</div>

<script>
function mulaiScan(tipe){
  localStorage.setItem('scan_type', tipe);
  location.href='scan.html';
}
</script>
</body>
</html>

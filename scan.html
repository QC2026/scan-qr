<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:#ffd700;font-family:sans-serif;padding:12px}
.header{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#1a1a1a,#000);border:2px solid #c9a84c;border-radius:12px;padding:10px}
.pt{background:#b91c1c;border:2px solid gold;border-radius:10px;padding:8px 12px;color:white;font-weight:900;flex:1;text-align:center}
.box{background:#111;border:2px solid #c9a84c;border-radius:12px;padding:12px;margin-top:12px}
.step{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin:4px;border:1px solid #444}
.active{background:gold;color:black}.done{background:#0f0;color:black}.wait{background:#222;color:#888}
#reader{margin-top:12px;border-radius:12px;overflow:hidden;background:#000;min-height:200px;display:flex;align-items:center;justify-content:center}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px}
.btn-cam{background:linear-gradient(180deg,#ffd700,#c9a84c);color:black}
.btn-save{background:#1a4d1a;color:white;border:2px solid #4a8a4a}
input{width:100%;padding:12px;background:#222;border:1px solid #444;color:white;border-radius:8px;box-sizing:border-box;margin-top:8px}
</style></head><body>
<div class="header"><div class="logo" style="width:50px;height:50px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#b91c1c"><img src="logo.png" style="width:100%;height:100%;border-radius:50%"></div><div class="pt">PT. URIPSUGIARTO</div></div>
<div class="box">
<div style="font-weight:900;color:#ffdf8a" id="tipe">SCAN</div>
<div id="steps" style="margin-top:8px"></div>
<div id="reader"><span style="color:#666;padding:20px;text-align:center">Klik tombol bawah untuk buka kamera</span></div>
<input id="manual" placeholder="Ketik manual jika QR rusak">
<button onclick="inputManual()" class="btn" style="background:#333;color:white">INPUT MANUAL</button>
<button id="btnSave" class="btn btn-save" style="display:none">💾 SIMPAN DATA</button>
<button onclick="resetScan()" class="btn" style="background:#222;color:white">🔄 ULANG</button>
</div>

<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
<button onclick="document.getElementById('fileInput').click()" class="btn btn-cam">📸 BUKA KAMERA HP - SCAN STEP INI</button>

<button onclick="location.href='index.html'" class="btn" style="background:#b91c1c;color:white;border:2px solid gold">⬅ KEMBALI KE HALAMAN 1</button>

<script>
const TYPE=localStorage.getItem('scan_type')||'BALL';
document.getElementById('tipe').innerText='SCAN: '+TYPE;
const FLOWS={
'GL':['QR CODE BAK','ID PC','ID GL 1','ID GL 2'],
'KMS':['QR CODE BAK','ID KMS'],
'PACK':['QR CODE BAK','ID PACK'],
'BDL':['QR CODE BAK','ID BDL'],
'BALL':['QR CODE BAK','ID BALL','NO BOX']
};
let flow=FLOWS[TYPE]||FLOWS['BALL'];let cur=0;let res={};
function renderSteps(){
 let h='';flow.forEach((s,i)=>{
  let cls=i<cur?'done':i==cur?'active':'wait';
  let txt=i<cur?'✓ '+s:i==cur?'▶ '+s:s;
  h+=`<span class="step ${cls}">${txt}</span>`;
 });document.getElementById('steps').innerHTML=h;
}
function onScanSuccess(decoded){
 if(cur>=flow.length) return;
 res[flow[cur]]=decoded; cur++; renderSteps();
 if(cur>=flow.length){
  document.getElementById('reader').innerHTML='<div style="color:#0f0;padding:20px;text-align:center;font-weight:900">✅ SEMUA STEP SELESAI<br>'+JSON.stringify(res)+'</div>';
  document.getElementById('btnSave').style.display='block';
 } else {
  document.getElementById('reader').innerHTML='<div style="color:gold;padding:20px;text-align:center">✅ '+flow[cur-1]+' OK: '+decoded+'<br><br>Silahkan scan: <b>'+flow[cur]+'</b><br><br>Klik 📸 lagi di bawah</div>';
 }
 if(navigator.vibrate) navigator.vibrate(200);
 document.getElementById('fileInput').value = '';
}
function inputManual(){
 let v=document.getElementById('manual').value.trim();
 if(!v) return alert('Isi dulu');
 onScanSuccess(v); document.getElementById('manual').value='';
}
function resetScan(){cur=0;res={};renderSteps();document.getElementById('btnSave').style.display='none';document.getElementById('reader').innerHTML='<span style="color:#666;padding:20px;text-align:center">Klik tombol bawah untuk buka kamera</span>'; document.getElementById('fileInput').value='';}
document.getElementById('fileInput').addEventListener('change',function(e){
 if(!e.target.files.length) return;
 let file=e.target.files[0];
 document.getElementById('reader').innerHTML='<div style="color:gold;padding:20px">⏳ Membaca QR...</div>';
 try{
  const html5QrCode=new Html5Qrcode("reader");
  html5QrCode.scanFile(file,true).then(decodedText=>{onScanSuccess(decodedText);}).catch(err=>{
   document.getElementById('reader').innerHTML='<div style="color:red;padding:20px">❌ QR tidak terbaca<br>'+err+'<br>Coba foto lebih jelas atau input manual</div>';
   document.getElementById('fileInput').value='';
  });
 } catch(er){
  document.getElementById('reader').innerHTML='<div style="color:red;padding:20px">❌ Library belum load, pakai Input Manual atau build dengan internet ON</div>';
  document.getElementById('fileInput').value='';
 }
});
document.getElementById('btnSave').onclick=async function(){
  let type = localStorage.getItem('scan_type');
  let bagian = localStorage.getItem('bagian')||'-';
  let tgl_input = localStorage.getItem('tgl_input')|| new Date().toISOString().split('T')[0];
  let all = JSON.parse(localStorage.getItem('riwayat')||'[]');
  let qr = res['QR CODE BAK']||res['QR BAK']||'';
  let idx = all.findIndex(d => d.QR_BAK == qr &&!d.ID_BALL);
  let status_jeda = 'VALID';
  if(type=='KMS' && idx!=-1 && all[idx].TGL_GL){
    let tglGL = new Date(all[idx].TGL_GL);
    let tglKMS = new Date(tgl_input);
    let jeda = Math.floor((tglKMS - tglGL)/(1000*60*60*24));
    if(jeda==0) status_jeda = 'SAMA HARI';
  }
  if(idx==-1){
    let newRow = { QR_BAK: qr, ID_PC: res['ID PC']||'', ID_GL: res['ID GL 1']||'', ID_GL2: res['ID GL 2']||'', ID_KMS: type=='KMS'?res['ID KMS']||'':'', ID_PACK: type=='PACK'?res['ID PACK']||'':'', ID_BDL: type=='BDL'?res['ID BDL']||'':'', ID_BALL: type=='BALL'?(res['ID BALL']||res['NO BOX']||''):'', TGL_GL: type=='GL'?tgl_input:'', TGL_KMS: type=='KMS'?tgl_input:'', STATUS_JEDA: status_jeda, BAGIAN: bagian, TANGGAL: tgl_input };
    all.push(newRow);
  } else {
    if(type=='KMS'){ all[idx].ID_KMS = res['ID KMS']||''; all[idx].TGL_KMS = tgl_input; all[idx].STATUS_JEDA = status_jeda; }
    if(type=='PACK'){ all[idx].ID_PACK = res['ID PACK']||''; }
    if(type=='BDL'){ all[idx].ID_BDL = res['ID BDL']||''; }
    if(type=='BALL'){ all[idx].ID_BALL = res['ID BALL']||res['NO BOX']||''; }
    all[idx].BAGIAN = bagian;
  }
  localStorage.setItem('riwayat',JSON.stringify(all));
  const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbzCr7BcKKAnlRkaExqpj0_euFXD9E4WBI7IkVhfiWmCrzuHdQLQJR3IUEIfMZwjh-g_8g/exec";
  let kirim = { QR_BAK: qr, ID_PC: res['ID PC']||'', ID_GL: res['ID GL 1']||'', ID_GL2: res['ID GL 2']||'', ID_KMS: res['ID KMS']||'', ID_PACK: res['ID PACK']||'', ID_BDL: res['ID BDL']||'', ID_BALL: res['ID BALL']||'', NO_BOX: res['NO BOX']||'', BAGIAN: bagian, TGL_KMS: tgl_input, STATUS_JEDA: status_jeda };
  document.getElementById('btnSave').innerText = "⏳ MENGIRIM KE GOOGLE...";
  try { await fetch(GOOGLE_URL, {method: 'POST', mode: 'no-cors', body: JSON.stringify(kirim)}); } catch(e){}
  alert('✅ Tersimpan! '+type+' - QR BAK '+qr+' Sudah masuk Google Sheet!');
  location.href='index.html';
};
renderSteps();
</script>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:#ffd700;font-family:sans-serif;padding:12px}
.header{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#1a1a1a,#000);border:2px solid #c9a84c;border-radius:12px;padding:10px}
.pt{background:#b91c1c;border:2px solid gold;border-radius:10px;padding:8px 12px;color:white;font-weight:900;flex:1;text-align:center}
.box{background:#111;border:2px solid #c9a84c;border-radius:12px;padding:12px;margin-top:12px}
.step{display:inline-block;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;margin:4px;border:1px solid #444}
.active{background:gold;color:black}.done{background:#0f0;color:black}.wait{background:#222;color:#888}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;margin-top:12px}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px}
input{width:100%;padding:12px;background:#222;border:1px solid #444;color:white;border-radius:8px;box-sizing:border-box;margin-top:8px}
#resultBox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;padding:20px;box-sizing:border-box}
.card{background:#1a1a1a;border:3px solid gold;border-radius:16px;padding:20px;text-align:center;margin-top:15%}
</style></head><body>
<div class="header"><div style="width:50px;height:50px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center"><img src="logo.png" style="width:100%;height:100%;border-radius:50%"></div><div class="pt">PT. URIPSUGIARTO</div></div>
<div class="box">
<div style="font-weight:900;color:#ffdf8a" id="tipe">SCAN</div>
<div id="steps" style="margin-top:8px"></div>
<div id="reader"></div>
<button onclick="paksaFokus()" class="btn" style="background:#2563eb;color:white">🔍 TAP JIKA BLUR - PAKSA FOKUS</button>
<div style="display:flex;gap:6px">
<button onclick="setZoom(1)" class="btn" style="background:#333;color:white;flex:1">1x</button>
<button onclick="setZoom(2.5)" class="btn" style="background:gold;color:black;flex:1">2.5x QR KECIL</button>
<button onclick="toggleTorch()" class="btn" style="background:#333;color:white;flex:1">🔦</button>
<button onclick="gantiKamera()" class="btn" style="background:#0d2a54;color:white;flex:1;border:2px solid #2a5aa8">🔄</button>
</div>
<input id="manual" placeholder="Ketik manual jika QR rusak">
<button onclick="inputManual()" class="btn" style="background:#333;color:white">INPUT MANUAL</button>
<div id="status" style="text-align:center;margin-top:10px;color:#0f0;font-weight:900"></div>
<button onclick="resetScan()" class="btn" style="background:#222;color:white">🔄 ULANG SEMUA</button>
</div>
<button onclick="location.href='index.html'" class="btn" style="background:#b91c1c;color:white;border:2px solid gold">⬅ KEMBALI</button>

<div id="resultBox">
  <div class="card">
    <div id="resStep" style="color:gold;font-weight:900;font-size:14px"></div>
    <h2 style="color:white;margin:8px 0">Hasil Scan:</h2>
    <h1 id="resValue" style="color:#0f0;word-break:break-all;font-size:26px;background:#000;padding:14px;border-radius:8px;border:1px solid #444"></h1>
    <div style="display:flex;gap:10px;margin-top:18px">
      <button onclick="confirmScan()" class="btn" style="background:#22c55e;color:white;flex:1">✅ SESUAI</button>
      <button onclick="ulangCurrent()" class="btn" style="background:#ef4444;color:white;flex:1">🔄 SALAH, ULANG</button>
    </div>
  </div>
</div>

<script>
const TYPE=(localStorage.getItem('scan_type')||'BALL').toUpperCase();
document.getElementById('tipe').innerText='SCAN: '+TYPE;
const FLOWS={'GL':['QR CODE BAK','ID PC','ID GL 1','ID GL 2'],'KMS':['QR CODE BAK','ID KMS'],'PACK':['QR CODE BAK','ID PACK'],'BDL':['QR CODE BAK','ID BDL'],'BALL':['QR CODE BAK','ID BALL','NO BOX']};
let flow=FLOWS[TYPE]||FLOWS['BALL'];let cur=0;let res={};let html5QrcodeScanner;let lastScanTime=0;let isPause=false;let tempScan="";let torchOn=false;
let allCams=[], curCamId=null;

function renderSteps(){let h='';flow.forEach((s,i)=>{let cls=i<cur?'done':i==cur?'active':'wait';let txt=i<cur?'✓ '+s:i==cur?'▶ '+s:s;h+=`<span class="step ${cls}">${txt}</span>`;});document.getElementById('steps').innerHTML=h;document.getElementById('status').innerHTML=cur<flow.length?`Scan: <b style="color:gold">${flow[cur]}</b>`:`✅ SELESAI...`;}
function onScanSuccess(decoded){if(isPause) return;const now=Date.now();if(now-lastScanTime<1200) return;lastScanTime=now;isPause=true;tempScan=decoded;try{html5QrcodeScanner.pause(true);}catch(e){} document.getElementById('resStep').innerText=flow[cur];document.getElementById('resValue').innerText=decoded;document.getElementById('resultBox').style.display='block';if(navigator.vibrate) navigator.vibrate([200,100,200]);}
function confirmScan(){document.getElementById('resultBox').style.display='none';res[flow[cur]]=tempScan;cur++;renderSteps();if(cur>=flow.length){autoSave();}else{isPause=false;try{html5QrcodeScanner.resume();}catch(e){} lastScanTime=Date.now();}}
function ulangCurrent(){document.getElementById('resultBox').style.display='none';isPause=false;tempScan="";lastScanTime=0;try{html5QrcodeScanner.resume();}catch(e){}}
function inputManual(){let v=document.getElementById('manual').value.trim();if(!v) return alert('Isi dulu');onScanSuccess(v);document.getElementById('manual').value='';}
function resetScan(){cur=0;res={};lastScanTime=0;isPause=false;tempScan="";document.getElementById('resultBox').style.display='none';renderSteps();try{html5QrcodeScanner.resume();}catch(e){}}

// --- GANTI FUNGSI startCam & gantiKamera YANG LAMA DENGAN INI ---

async function startCam(){
  html5QrcodeScanner = new Html5Qrcode("reader");
  const qrboxFn = (vw,vh)=>{let m=Math.min(vw,vh);return{width:Math.floor(m*0.75),height:Math.floor(m*0.75)};};

  try{
    // Cara resmi html5-qrcode buat list kamera - paling ampuh
    let cameras = await Html5Qrcode.getCameras();
    if(!cameras || cameras.length==0) throw "No camera";
    allCams = cameras;

    // Cari yang belakang: id / label mengandung back/rear/environment, kalo gak ada ambil yang terakhir (100% belakang di Android)
    let back = cameras.find(c => /back|rear|environment|belakang/i.test(c.label));
    if(!back){
      // Trik jitu Android: kamera belakang biasanya index terakhir, depan index 0
      back = cameras.length > 1? cameras[cameras.length-1] : cameras[0];
    }
    curCamId = back.id;

    console.log("PILIH KAMERA BELAKANG:", back.label, back.id);

    await html5QrcodeScanner.start(
      { deviceId: { exact: curCamId } },
      {
        fps: 12,
        qrbox: qrboxFn,
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        videoConstraints: { width:{ideal:1920}, height:{ideal:1080}, focusMode:{ideal:"continuous"} }
      },
      onScanSuccess,()=>{}
    );
    document.getElementById('status').innerText = "✅ "+(back.label||"Kamera Belakang");

  }catch(err){
    console.log("Fallback facingMode", err);
    // Fallback terakhir paksa environment
    try{
      await html5QrcodeScanner.start(
        { facingMode: { exact: "environment" } },
        { fps: 12, qrbox: 250 },
        onScanSuccess,()=>{}
      );
    }catch(e){
      // Kalo exact gagal, coba tanpa exact
      await html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 12, qrbox: 250 },
        onScanSuccess,()=>{}
      );
    }
  }
}

async function gantiKamera(){
  try{
    let cameras = await Html5Qrcode.getCameras();
    if(cameras.length < 2) return alert("Cuma 1 kamera");
    let idx = cameras.findIndex(c=>c.id===curCamId);
    let next = cameras[(idx+1)%cameras.length];
    curCamId = next.id;
    await html5QrcodeScanner.stop();
    startCam();
  }catch(e){ alert(e); }
}
async function autoSave(){
  if(html5QrcodeScanner){try{await html5QrcodeScanner.stop();}catch(e){}}
  let bagian=localStorage.getItem('bagian')||TYPE;
  let tgl_input=localStorage.getItem('tgl_input')||new Date().toISOString().split('T')[0];
  let all=JSON.parse(localStorage.getItem('riwayat')||'[]');
  let qr=res['QR CODE BAK']||'';let idx=all.findIndex(d=>d.QR_BAK==qr&&!d.ID_BALL);
  if(idx==-1){all.push({QR_BAK:qr,ID_PC:res['ID PC']||'',ID_GL:res['ID GL 1']||'',ID_GL2:res['ID GL 2']||'',ID_KMS:TYPE=='KMS'?res['ID KMS']||'':'',ID_PACK:TYPE=='PACK'?res['ID PACK']||'':'',ID_BDL:TYPE=='BDL'?res['ID BDL']||'':'',ID_BALL:TYPE=='BALL'?(res['ID BALL']||res['NO BOX']||''):'',TGL_GL:TYPE=='GL'?tgl_input:'',TGL_KMS:TYPE=='KMS'?tgl_input:'',BAGIAN:bagian,TANGGAL:tgl_input});}
  else{if(TYPE=='KMS'){all[idx].ID_KMS=res['ID KMS']||'';all[idx].TGL_KMS=tgl_input;}if(TYPE=='PACK'){all[idx].ID_PACK=res['ID PACK']||'';}if(TYPE=='BDL'){all[idx].ID_BDL=res['ID BDL']||'';}if(TYPE=='BALL'){all[idx].ID_BALL=res['ID BALL']||res['NO BOX']||'';}all[idx].BAGIAN=bagian;}
  localStorage.setItem('riwayat',JSON.stringify(all));
  const GOOGLE_URL="https://script.google.com/macros/s/AKfycbzCr7BcKKAnlRkaExqpj0_euFXD9E4WBI7IkVhfiWmCrzuHdQLQJR3IUEIfMZwjh-g_8g/exec";
  let kirim={QR_BAK:qr,ID_PC:res['ID PC']||'',ID_GL:res['ID GL 1']||'',ID_GL2:res['ID GL 2']||'',ID_KMS:res['ID KMS']||'',ID_PACK:res['ID PACK']||'',ID_BDL:res['ID BDL']||'',ID_BALL:res['ID BALL']||'',NO_BOX:res['NO BOX']||'',BAGIAN:bagian,TGL_KMS:tgl_input};
  document.getElementById('status').innerText="⏳ AUTO KIRIM...";
  try{await fetch(GOOGLE_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(kirim)});}catch(e){}
  alert('✅ Tersimpan! '+TYPE+' - '+qr);location.href='index.html';
}
renderSteps();startCam();
</script>
</body></html>
